zh_cn_specific: |
  The normalization ladder deliberately does NOT fold full-width to half-width forms, and does
  NOT apply NFKC: NFC leaves U+FF01..U+FF5E and ideographic punctuation distinct, and that is
  the intended behaviour until real data says otherwise (requirements section 5 locale notes).
  A MEASURE-ONLY width probe runs on every task and logs, for each prompt-vs-first-user-block
  inequality, whether full-width characters are present, whether the two become equal after
  width folding, and the word overlap. Width folding is added ONLY if the probe shows it in real
  zh-CN data, with the probe line as the incident citation. The suite carries the width-form
  near-miss pair as KNOWN-OPEN: its result is recorded in the run log, never asserted.
