shape: |
  Two sides via compareBaseAndTest SIDE_BY_SIDE_COMPARISON, progressive per-model form.
  Per-side keys arrive as compareBaseAndTest.<model name>.<questionKey> under
  conversation.ratings (object map key -> {value}); batch axes at conversation.input.
  Test = model_A = "Nippon (PContext mode 23) - Mochi Fast"
  Base = model_B = "Nippon (PContext mode 23) - Prod Frozen Fast"
  38 config fields, 27 of them per side. Both model names contain " - " and the batch sheet
  joins namespace and key with the same " - ", so keys are only ever split at the LAST "."
  and model names are matched by exact canonical string, never by prefix or substring.
  Artifacts are Google Drive FILE links in every debug slot, htmlExport and geminiTakeout --
  fetched and content-checked, not just link-shape-checked.

coverage: |
  50 checks implemented and build-asserted (one owner per register ID):
    R-01..R-09  completeness (blank required, declared-vs-filled, stale hidden slots,
                loss-by-construction)
    G-01..G-06  gate cascades (required-when-shown + empty-when-hidden), transcribed from the
                config's own displayConditions, plus enum membership -- Test side only
    U-01..U-07  artifact URL integrity (pasted debug/HTML, no link, multi-link, folder, host)
    D-01        artifact identity (same Drive file id across slots)
    F-01..F-09  fetched-artifact content (fetch failure, debug/HTML/Takeout sanity, export
                shape, the bait-turn invariant, byte-identical re-uploads, PContext trigger,
                and F-09: the conversation run on the wrong model)
    A-01..A-05  content anchoring (form prompt vs capture, bait prompt across sides, shared
                history containment, within-side history, turn-1 single prompt)
    I-01..I-03  identity (Agency config id frozen/non-frozen, cross-side distinctness,
                model order vs the batch)
    C-01..C-07  coherence (stop-at-the-loss-turn, Base turn count, memory-section vocabulary,
                [Turn X] labels, category-vs-core-task, the open Harmless-Callback ruling)
    B-01..B-03  assignment vs submission (batch axes; self-skips with a loud log)

