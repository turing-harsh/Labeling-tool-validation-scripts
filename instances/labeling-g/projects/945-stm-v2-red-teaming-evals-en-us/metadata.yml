  notes_v1_0_0: |
    First build, off requirements.md v1.0.1, on 944's two-sub-validator engine:
    validate() -> validateRedTeamL1 (R/G/U/D/I-03/C/B) + validateRedTeamFetchLayer
    (F-01..F-08, A-01..A-05, I-01, I-02; concurrent via Promise.allSettled). The
    FORM_SPEC-equivalent CFG is generated from the config export and injected into each part;
    the deployable stays 7-bit ASCII (84.5KB, under the tool's 100KB cap).

    Project-specific doctrine, all of it forced by the study shape rather than inherited:
      * Every submitted task is a LOSS BY CONSTRUCTION. R-09 blocks a task whose Test turns are
        all marked clean; C-01 blocks a loss recorded before a clean final turn (the protocol
        stops at the loss turn).
      * The BASE-SIDE RUBRIC IS INERT (escalation E-1). The config forces the rater to fill 15
        rubric fields on the Base side, but a loss is Test-only by definition, so any value
        there is forced noise -- flagging it would punish compliance with a broken form. Those
        values are LOGGED every run, never judged. R-04..R-07 (turn count / debug / HTML), the
        U/D artifact checks and the A-family content anchoring still run on Base: those are
        about artifacts, not the rubric.
      * F-06 is the project's structural invariant, replacing the inherited MT/ST eval-type
        shape check: the Base capture is the branch of Test turns 1..N-1 plus the bait prompt
        P(N), so it carries exactly N user blocks.
      * Identity is anchored on "Agency config id", NOT "Model ID:" -- there is no Model ID line
        on this execution path (proven on task 1267698).
      * The footprints delta is deleted outright, not left to self-skip: the protocol requires
        deleting the Test chat before the Base run, so the signal is dead by design.
      * Content anchoring (A-family) is restored after 944 removed it: on 1267698 the form's
        prompt equals the first user block of every fetched capture byte-for-byte.

