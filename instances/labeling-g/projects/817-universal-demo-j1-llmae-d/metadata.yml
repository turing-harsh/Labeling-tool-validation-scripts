notes: |
  Deterministic port of Harbor's checks/deterministic_task_validation.py — see
  requirements.md for the rule table, the three profiles and the four documented
  divergences. Reads the package ZIP from ratings.taskFolder with
  fetchDataFromGcsZip, which was added to run-checks-api for this project
  (apps/run-checks-api/src/app/run-checks/gcs-fetcher.ts, fetchAndTrackZip):
  the older fetchDataFromGcsLink returns the ZIP bytes decoded as UTF-8, which
  destroys ~40% of a deflated archive, so only entry names survived it.

  Batch 8647's sample package is pre-finalization (no qc_report.html, no
  client_qc*, no evaluations/platform), so it passes `upload` with 14 advisories
  and fails `audit`/`delivery`. Confirm which profile this project should gate on
  before setting PROFILE and deploying.
