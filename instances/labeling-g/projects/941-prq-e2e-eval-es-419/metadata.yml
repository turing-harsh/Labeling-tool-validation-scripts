named_deviations: |
  Three places where the build knowingly departs from the literal requirements text. Each wants
  a ruling; none is a silent choice.

  1. F4-A / F4-B / F4-C are SCOPED BY DEBUG EXPORT SHAPE, detected per side and logged.
     The requirements state all three unconditionally. Taken literally each false-fires on one
     of the two legitimate Gemini export shapes: F4-A and F4-C on a FLAT export (turn t's file
     holds only turn t), F4-B on a CUMULATIVE one (turn t replays turns 1..t, so its last block
     is turn t's question, not the starting prompt). 944 v2.0.2 and v2.0.3 were BOTH production
     false blocks caused by assuming one shape, and 944 v2.0.3 proved captures are cumulative in
     real data. So: F4-A runs on turn 1 always and on later turns only when cumulative; F4-B
     only when flat; F4-C only when cumulative. Turn 1 anchoring (F4-A, F4-D) is unconditional
     under every shape, so a wrong Turn 1 conversation is still caught either way. Settle with
     the first real export (requirements section 9 row 5).

  2. F6-09 option equality: the "short value vs long label" rule the requirements ask for
     ("treat N/A and its long label as the same answer") applies ONLY when one side carries no
     separator. A looser shared-first-segment reading made
     "Mode 23 -> Something Else - Fast" equal to "Mode 23 -> Ramen (top-20) - Fast" and silently
     disabled F5-04 -- caught by that check's own fixture. Model names never go through option
     equality at all; they use the arrow/whitespace/case canonicalizer.

  3. Requirements Fact 4 counts "13 top-level keys". The config has 14 non-per-side keys, of
     which one is compareModels and three are BREAKPOINTs carrying no answer. The build asserts
     10 answerable task fields + 3 breakpoints = 13, and that the whole field count closes
     (51 + 10 + 3 + 1 = 65).

