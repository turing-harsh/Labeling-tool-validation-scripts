    Model rename (revised config export, 9 Sep 2026): model_A went from
    "Mode 23 -> Ramen (top-20) - Fast" to "PContext Mode 23 (Nippon) > Mochi - Fast" (EN DASH
    before "Fast"). A machine diff of the old and new exports showed the name is the ONLY
    change -- all 65 fields, the gate graph, every option vocabulary and the field ordering are
