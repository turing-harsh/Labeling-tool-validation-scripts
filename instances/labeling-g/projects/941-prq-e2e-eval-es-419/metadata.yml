    through on its own; the two code fixes below were needed because the new name's SHAPE broke
    assumptions:
      * F3-09's discriminator recognised only {"->", " - "} as separators, so on the new name it
        split first at the " - " before "Fast" and reduced the form name to "fast" while the
        saved page reduced to "mochifast" -- an ERROR ON EVERY CORRECT TEST-SIDE TASK. A bare
        ">" is now a separator. Pinned by a permanent two-direction regression case; reverting
        the one-character fix fails 23 of the 67 fixtures, including every clean-task case.
      * canonModel (A-04 side binding, F5-04, run-order) now collapses either "->" or a bare
        ">" in ONE pass, so arrow-style variants of the same name canonicalize equal. One pass,
        not two: replacing ">" first also eats the ">" inside "->" and mangles every
        ASCII-arrow name (caught while writing the fix).
    The builder now reports every separator/dash style in each configured model name, so a
    future rename in an unseen style gets a human look instead of silent handling.
    The superseded export is kept at config/project-config-id-941.superseded-ramen.json.

