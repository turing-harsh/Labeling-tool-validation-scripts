shape: |
  Two sides via compareModels SIDE_BY_SIDE_COMPARISON. Per-side answers arrive namespaced
  compareModels.<model name>.<questionKey>; 51 per-side keys, 10 answerable task keys,
  3 breakpoints, 65 config fields total.
  Test = model_A = "PContext Mode 23 (Nippon) > Mochi - Fast"   (EN DASH before "Fast")
  Base = model_B = "Mode 23 -> Prod Frozen - Fast"
  Sides bind by EXACT canonical match of the namespace to a configured model name -- never from
  csv Model A / Model B (those are run-order columns, the 939 learning) and never by position.
  Artifacts are Google Drive file links, fetched and content-checked. Batch metadata (First
  Model / Prompt Type / Additional Rater Instruction / destination folder) is discovered by
  shape search; every batch-layer check self-skips with a loud log when it is absent.
  Locale assignment for F7-01: Spanish / LatAm (All Variants), SUPPLIED by the build -- the
  config carries no locale marker, so this is a warning until the client rules it a hard
  assignment (escalation 6).
