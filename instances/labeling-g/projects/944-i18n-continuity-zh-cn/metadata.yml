shape: |
  Two sides via compareModels SIDE_BY_SIDE_COMPARISON. Per-side keys arrive as
  compareModels.<model name>.<questionKey> under conversation.ratings (object map key -> {value}).
  Model A = "07 Pizzi Gemelli --> Fast (paid) (prod default + notebook)"
  Model B = "Pcontext Mode 23 (Nippon) > Ramen (top 20) - Fast"
  97 config fields, 55 per side. Single Turn and Multi Turn on one form. Artifacts are Google
  Drive links, fetched and content-checked (v2.0.0, §8-9), not just link-shape-checked. Batch/input
  axes (Task Type, First Model, Conversation Track, Model A/B, Target Language, Dialect, ...) live
  at conversation.input; §11 self-skips loudly if absent.

coverage: |
  61 checks implemented and build-asserted (one per register ID):
    R-01..R-09  completeness (blank required, declared-vs-filled, stale hidden slots)
    G-01..G-13  gate cascades (required-when-shown + empty-when-hidden), transcribed from config displayConditions
    U-01..U-07  artifact URL integrity (pasted debug/HTML, no link, multi-link, folder, host)
    D-01        artifact identity (same Drive file id across slots)
    F-01..F-05  fetched-artifact content (fetch failure, debug/HTML sanity, cross-artifact fingerprint identity, turn-count vs debug) — v2.0.0, Layer L2
    I-01..I-03  namespace / ranking identity
    C-01..C-16  coherence (cold-start gate cascade, satisfaction anchor C-11, English-thread exception C-06, MT ranking coherence)
    B-01..B-07  assignment vs submission (batch axes)
  Build discipline (§20): FORM_SPEC generated from the config export; zero phantom keys;
  every register ID present exactly once; rebuild-twice hash diff; no serial fetch loops (§8
  concurrency budget). fixtures/cases.json carries a smoke pass + adversarial fire + near-miss
  non-fire per check family; F-family fixtures mock fetchDataFromDriveLink via wrapper.mjs's
  fetchDir convention.

notes: |
  Layer L1 (deterministic, computable from bytes) plus Layer L2 (deterministic, computable from a
  fetched artifact's bytes — v2.0.0, §8-9). Semantic questions (§12) belong to the QD pack;
  remaining unverifiable items (§13: turn caps, recency, exclusion window, citation accuracy,
  filename convention) stay out of scope — fetched thread pages still carry no confirmed turn
  delimiters or timestamps. Drive-link resolution moved OUT of that list in v2.0.0 (now F-01).
  Content-anchored debug checks (Check A-D) and Model-ID identity from the predecessor engine
