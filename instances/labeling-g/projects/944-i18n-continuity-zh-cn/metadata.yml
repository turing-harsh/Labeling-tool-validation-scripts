shape: |
  Two sides via compareModels SIDE_BY_SIDE_COMPARISON. Per-side keys arrive as
  compareModels.<model name>.<questionKey> under conversation.ratings (object map key -> {value}).
  Model A = "07 Pizzi Gemelli --> Fast (paid) (prod default + notebook)"
  Model B = "Pcontext Mode 23 (Nippon) > Ramen (top 20) - Fast"
  97 config fields, 55 per side. Single Turn and Multi Turn on one form. Artifacts are Google
  Drive links only. Batch/input axes (Task Type, First Model, Conversation Track, Model A/B,
  Target Language, Dialect, ...) live at conversation.input; §9 self-skips loudly if absent.

coverage: |
  56 deterministic checks implemented and build-asserted (one per register ID):
    R-01..R-09  completeness (blank required, declared-vs-filled, stale hidden slots)
    G-01..G-13  gate cascades (required-when-shown + empty-when-hidden), transcribed from config displayConditions
    U-01..U-07  artifact URL integrity (pasted debug/HTML, no link, multi-link, folder, host)
    D-01        artifact identity (same Drive file id across slots)
    I-01..I-03  namespace / ranking identity
    C-01..C-16  coherence (cold-start gate cascade, satisfaction anchor C-11, English-thread exception C-06, MT ranking coherence)
    B-01..B-07  assignment vs submission (batch axes)
  Build discipline (§18): FORM_SPEC generated from the config export; zero phantom keys;
  every register ID present exactly once; rebuild-twice hash diff. fixtures/cases.json carries
  a smoke pass + adversarial fire + near-miss non-fire per check family.

notes: |
  Layer L1 only (deterministic, computable from bytes). Semantic questions (§10) belong to the
  QD pack; unverifiable items (§11: turn caps, recency, filename convention, link resolution)
  are out of scope by design — the payload carries Drive links, not fetched content, so content-
  anchored debug checks from the predecessor engine were deliberately removed (§12) in favour of
  §6 URL discipline and §7 Drive-id identity.

  Highest-value false-block guard: C-06 (English-thread exception) WARNS rather than blocks and
  is suppressed entirely when "Dominant threads language is English" is declared. Only C-10/C-11
  and the assignment blocks fire at ERROR on satisfaction/severity; C-12..C-14 stay warnings (no
  client sentence behind them — §8.1).

  First-task verification (§15, blocking at deploy): confirm the per-side key shape
  compareModels.<model name>.<qKey>, that the batch/input root resolves, and replay one completed
  Multi-Turn task (no completed MT existed in the sample — every MT check is structurally verified
  but behaviourally unproven). The run logs every discovered namespace on every task.

  Local `npm test` runs 65 fixtures through the same sandbox the tool uses.
