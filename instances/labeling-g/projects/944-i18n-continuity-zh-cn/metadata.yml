  notes_v2_0_4: |
    ISOLATE MEMORY BLOWOUT on task 1264206. The tool reported "Validation failed: Promise was
    abandoned" (check key scriptExecution) -- isolated-vm disposing the isolate on its 256MB
    limit, which rejects the still-pending Promise.allSettled over the fetches, so the error
    surfaces at the fetch and not at the allocation that killed it. 1264206 links 38.3MB of
    artifacts across 9 files (an 18.20MB Takeout export and four 4.6-5.5MB saved conversation
    pages) and the script retained THREE full UTF-16 copies of each (content, decoded,
    normalized): measured peak RSS 849MB. Fixes: (1) geminiConversationHistory is no longer
    fetched -- Takeout size is unbounded and the helper JSON.parses it before handoff; F-03's
    Takeout half is withdrawn, link-shape checks still cover the field. (2) Only the debug
    family retains its text (F-02/F-05 need all of it; 25-175KB per file); every other artifact
    is reduced on arrival to a 4096-char prefix + a length:hash fingerprint, and each settled
    slot is nulled as the loop consumes it. F-03 reads the prefix; F-04 compares fingerprints
    (raw-byte identity now, not post-normalisation identity). (3) The fetch retry is
    deadline-gated at 12s. Peak RSS on 1264206: 849MB -> 118MB. Fixture "F-03 takeout" replaced
    by a not-fetched non-fire.
  notes_v2_0_3: |
    F-05 false-block fix #2, from the FIRST completed Multi-Turn task (1264388). Gemini debug
    captures are CUMULATIVE: turn t's capture replays turns 1..t, so it carries t
    "<ctrl99>user" markers. v2.0.2 summed markers across a side's files and compared the sum
    to numberOfTurns -- Model A summed 1+2=3 against declared 2, Model B 1+2+3=6 against
    declared 3, blocking both sides of a correct submission. F-05 now counts per file and
    fires only when the counts fit NEITHER shape: flat (1 marker per file, sum == number of
    fetched slots -- what every ST task looks like) nor cumulative (turn t carries t). The
    flat sum compares against fetched slots, not declared, because debug slots cap at 5.
    Closes requirements SS17 item 4 (Multi-Turn branch behaviourally proven). New fixtures:
    DBG_CUMUL2 (F-05 non-fire) and a fits-neither fire case.
  notes_v2_0_2: |
    F-05 false-block fix from the FIRST PRODUCTION RUN: both sides blocked with "0 turns
    counted, 1 declared" though the fetched debug carried the markers (F-02 passed on the same
    bytes). Root cause: the strict "<ctrl99>user\n...<ctrl100>" block regex demanded a bare LF
    after the role token; real captures vary (CRLF from Windows-saved files, tags in Doc/HTML
    exports, escaped newlines in JSON-encoded blobs). Turn counting now anchors on the
    "<ctrl99>user" open marker (\b so "username" never counts; case-insensitive). Mismatches
    log an escaped byte-context snippet per debug file so a new export shape self-diagnoses
    from the tool's run log. New regression fixture DBG_CRLF (F-05 non-fire).
